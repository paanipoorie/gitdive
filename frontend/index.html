<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#041a3d">
  <title>GitDive — Repository Explorer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="scanlines"></div>

  <header class="topbar">
    <a class="logo" href="index.html">
      <span class="logo-mark">⌄</span>
      <span>GIT<br><b>DIVE</b></span>
    </a>
  </header>

  <main>
    <section class="hero">
      <div class="water-light"></div>

      <div class="hero-copy">
        <h1>EXPLORE REPOSITORY<br><span>COMMIT HISTORY.</span></h1>
        <p class="intro">
          Paste a GitHub repository link to inspect commits, changed files, and AI-generated summaries.
        </p>
        <a class="primary-button" href="explorer.html">
          <span class="github-icon">◉</span> EXPLORE A REPOSITORY <span class="arrow">→</span>
        </a>
        <p class="microcopy">READ-ONLY ACCESS <span>•</span> YOUR CODE STAYS YOURS</p>
      </div>

      <div class="hero-scene">
        <span class="bubble b1"></span>
        <span class="bubble b2"></span>
        <span class="bubble b3"></span>
        <img src="assets/female.png" alt="Pixel-art diver" class="hero-diver">
        <img src="assets/creatures.png" alt="" class="creatures">
      </div>
    </section>
  </main>

  <footer>
    <span>GITDIVE © 2026</span>
    <span>REPOSITORY COMMIT EXPLORER</span>
    <a href="explorer.html">EXPLORE →</a>
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
